<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار الجزء الثاني عشر (من هود 6 إلى يوسف 52 (ص 222 إلى ص 241)) | مدكر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>:root{
  --brand:#4B365F; --brand-2:#6b5285; --brand-soft:#efeaf4;
  --ok:#3E5F3F; --ok-bg:#E9F0E9; --bad:#8a2b2b; --bad-bg:#f8e7e7; --warn:#8a6d1f; --warn-bg:#fcf3dc;
  --bg:#f4f4f6; --card:#ffffff; --text:#1f1f24; --muted:#6b6b76; --line:#dedde3;
  --q-info:#f1eff4; --q-content:#e7f3f5; --q-content-line:#b8dce2;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.7;direction:rtl}
a{color:var(--brand)}
button{font-family:inherit}
.topbar{background:var(--brand);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 18px;position:sticky;top:0;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.topbar .t{font-weight:700;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .tbt{font-variant-numeric:tabular-nums;direction:ltr;background:rgba(255,255,255,.15);padding:3px 10px;border-radius:6px;font-weight:700}
.topbar .tbt:empty{display:none}
.topbar .tbt.low{background:#c62828}
.topbar a{color:#fff;text-decoration:none;font-size:14px;border:1px solid rgba(255,255,255,.4);padding:4px 12px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:10px}
.card{background:var(--card);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:22px}
h1.qtitle{font-size:22px;color:var(--brand);margin:0 0 14px}
.btn{display:inline-block;border:0;border-radius:6px;padding:9px 20px;font-size:15px;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-2)}
.btn-secondary{background:#e4e2e8;color:#333}
.btn-secondary:hover{background:#d6d3dc}
.btn-link{background:none;color:var(--brand);padding:4px 6px}
.quizinfo{text-align:center;margin:10px 0 20px}
.quizinfo p{margin:4px 0}
.notice{background:var(--brand-soft);border-right:5px solid var(--brand);padding:12px 16px;border-radius:6px;margin:14px 0;font-size:15px}
table.gen{width:100%;border-collapse:collapse;margin:14px 0;font-size:15px}
table.gen th,table.gen td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
table.gen thead th{background:#ecebf0}
table.gen tr:nth-child(even) td{background:#fafafa}
.center{text-align:center}
/* attempt layout */
.attempt{display:grid;grid-template-columns:1fr 250px;gap:20px;align-items:start}
.navblock{position:sticky;top:70px;background:var(--card);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:14px}
.navblock h3{margin:0 0 8px;font-size:15px;color:var(--brand)}
.timer{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin-bottom:10px;font-size:14px;text-align:center}
.timer b{font-variant-numeric:tabular-nums;font-size:17px;direction:ltr;display:inline-block}
.timer.low{background:var(--bad-bg);border-color:#e3b3b3;color:var(--bad)}
.qnbuttons{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.qnb{width:34px;height:40px;border:1px solid #bbb;border-radius:4px;background:#fff;cursor:pointer;font-size:13px;position:relative;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:hidden}
.qnb .n{height:26px;line-height:26px}
.qnb .st{width:100%;height:12px;border-top:1px solid #ccc;background:#fff}
.qnb.answered .st{background:#9e9e9e}
.qnb.current{outline:2px solid var(--brand);outline-offset:1px}
.qnb.flagged::after{content:"";position:absolute;top:0;left:0;border-top:10px solid #d9534f;border-right:10px solid transparent}
.qnb.correct .st{background:#5cb85c}.qnb.incorrect .st{background:#d9534f}
/* question */
.que{display:flex;gap:14px;margin-bottom:22px}
.que .info{flex:0 0 130px;background:var(--q-info);border:1px solid #d9d4e0;border-radius:6px;padding:10px;font-size:13px;align-self:flex-start}
.que .info .no{font-size:15px;margin:0 0 4px}
.que .info .no .qno{font-size:20px;font-weight:700}
.que .info .flag{margin-top:8px;cursor:pointer;color:var(--brand);user-select:none}
.que .content{flex:1;min-width:0}
.que .formulation{background:var(--q-content);border:1px solid var(--q-content-line);border-radius:6px;padding:16px}
.qtext .stem{font-size:19px;font-weight:700;color:var(--brand);border-right:5px solid var(--brand);padding:10px;margin-bottom:16px;background:rgba(255,255,255,.5)}
.qtext .ayah{font-family:"Amiri","Traditional Arabic","Scheherazade New",serif;font-weight:400;font-size:22px;color:#2a2238}
.prompt{font-size:14px;color:var(--muted);margin:0 0 6px}
.answer>label{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:6px;cursor:pointer;margin-bottom:4px;border:1px solid transparent}
.answer>label:hover{background:rgba(255,255,255,.6)}
.answer input{margin-top:7px}
.answer .an{font-weight:700;min-width:22px}
.answer .ok-ic{color:#2e7d32;font-weight:700;margin-inline-start:6px}
.answer .bad-ic{color:#c62828;font-weight:700;margin-inline-start:6px}
.answer label.is-correct{background:#dff0d8;border-color:#b9dcae}
.answer label.is-wrong{background:#f2dede;border-color:#e5bcbc}
.sfb{margin-top:10px;border:2px solid var(--ok);background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:10px;font-size:15px}
.sfb.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.sfb .src{display:block;font-size:12px;opacity:.8;margin-top:4px}
.outcome{margin-top:10px;background:var(--warn-bg);border:1px solid #ecd9a6;border-radius:6px;padding:10px;color:#5c4a14;font-size:15px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:#ece7f2;color:var(--brand);margin-inline-start:6px;font-weight:400}
.state-correct{color:#2e7d32}.state-wrong{color:#c62828}.state-none{color:var(--muted)}
/* review summary */
table.reviewsum{width:100%;border-collapse:collapse;margin-bottom:22px}
table.reviewsum th{width:130px;background:#ecebf0;text-align:right;padding:8px 12px;border-bottom:1px solid #fff;vertical-align:top}
table.reviewsum td{background:#f6f6f8;padding:8px 12px;border-bottom:1px solid #fff}
.band{border-radius:10px;overflow:hidden;max-width:420px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.band .bh{color:#fff;padding:12px 16px;font-size:20px;font-weight:700;text-align:center}
.band .bb{background:#fff;padding:12px 16px;text-align:center;font-size:15px}
.band .bb .tip{background:#f3f1f6;border-radius:6px;padding:8px;margin-top:8px;font-size:14px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:10px;max-width:480px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:17px}
.modal .mb{padding:16px 18px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start}
.hidden{display:none!important}
@media (max-width:860px){
  .attempt{grid-template-columns:1fr}
  .navblock{position:static}
  .qnb{width:30px;height:36px;font-size:12px}.qnb .n{height:22px;line-height:22px}
  .que{flex-direction:column}
  .que .info{flex:none;display:flex;gap:14px;align-items:center;flex-wrap:wrap;width:100%}
  .que .info .no{margin:0}
  .qtext .stem{font-size:17px}.qtext .ayah{font-size:20px}
  table.reviewsum th{width:95px}
}
</style></head>

 * لا يُحمَّل شيء من Firebase إلا إذا ضغط المستخدم «تسجيل الدخول» أو كان قد سجّل الدخول سابقًا.
 * المتصفح هو النسخة الأساسية دائمًا؛ السحابة نسخة إضافية. */
(function () {
  "use strict";
  var CFG = window.FIREBASE_CFG;
  var NS = "moddaker-mukhtasar", FLAG = NS + ":syncOn", DONE = NS + ":synced", LAST = NS + ":lastPull";
  var SDK = "https://www.gstatic.com/firebasejs/10.14.1/";
  var S = { fb: null, booting: null, user: null, status: "idle", err: "", cbs: [], busy: false, again: false };

  function get(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function enabled() { return !!(CFG && CFG.apiKey) && /^https?:$/.test(location.protocol); }
  function emit(status, err) {
    if (status) S.status = status;
    S.err = err || "";
    S.cbs.forEach(function (cb) { try { cb({ user: S.user, status: S.status, error: S.err }); } catch (e) {} });
  }

  /* ---- attempt <-> compact Firestore document (Firestore has no nested arrays) ---- */
  function enc(juz, a) {
    return {
      juz: juz, started: a.started, finished: a.finished, marks: a.marks, total: a.total, timeout: !!a.timeout,
      slots: a.slots.map(function (s) { return [s.id, s.order.join(""), s.resp === null ? -1 : s.resp, s.flag ? 1 : 0, s.ok ? 1 : 0].join("|"); })
    };
  }
  function dec(d) {
    return {
      started: d.started, finished: d.finished, marks: d.marks, total: d.total, timeout: !!d.timeout,
      slots: d.slots.map(function (t) {
        var x = t.split("|");
        return { id: x[0], order: x[1].split("").map(Number), resp: +x[2] < 0 ? null : +x[2], flag: x[3] === "1", ok: x[4] === "1" };
      })
    };
  }
  function docId(juz, a) { return juz + "_" + a.started; }
  function localKeys() {
    var out = [];
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k.indexOf(NS + ":attempts:") === 0) out.push(k); } } catch (e) {}
    return out;
  }
  function mergeLocal(juz, a) {
    var k = NS + ":attempts:" + juz, list = get(k, []);
    if (list.some(function (x) { return x.started === a.started; })) return false;
    list.push(a); list.sort(function (x, y) { return x.started - y.started; }); set(k, list);
    return true;
  }

  /* ---- Firebase boot (lazy) ---- */
  function boot() {
    if (S.booting) return S.booting;
    S.booting = Promise.all([import(SDK + "firebase-app.js"), import(SDK + "firebase-auth.js"), import(SDK + "firebase-firestore.js")]).then(function (m) {
      var app = m[0].initializeApp(CFG);
      S.fb = { auth: m[1], fs: m[2], a: m[1].getAuth(app), db: m[2].getFirestore(app) };
      S.fb.auth.onAuthStateChanged(S.fb.a, function (u) { S.user = u; emit(u ? "signed-in" : "idle"); if (u) syncNow(); });
      return S.fb;
    }).catch(function (e) { S.booting = null; emit("error", "تعذّر تحميل خدمة المزامنة. تحقق من الاتصال بالإنترنت."); throw e; });
    return S.booting;
  }

  /* ---- sync: pull new cloud attempts, push local ones not yet uploaded ---- */
  function syncNow() {
    if (!S.user || !S.fb) return Promise.resolve();
    if (S.busy) { S.again = true; return Promise.resolve(); }
    S.busy = true; emit("syncing");
    var fs = S.fb.fs, col = fs.collection(S.fb.db, "users", S.user.uid, "attempts");
    var last = +get(LAST, 0) || 0, done = {}, maxAt = last, pulled = 0;
    get(DONE, []).forEach(function (id) { done[id] = 1; });
    var q = last ? fs.query(col, fs.where("at", ">", fs.Timestamp.fromMillis(last))) : col;
    return fs.getDocs(q).then(function (snap) {
      snap.forEach(function (d) {
        var x = d.data();
        if (mergeLocal(x.juz, dec(x))) pulled++;
        done[d.id] = 1;
        if (x.at && x.at.toMillis() > maxAt) maxAt = x.at.toMillis();
      });
      var jobs = [];
      localKeys().forEach(function (k) {
        var juz = k.slice((NS + ":attempts:").length);
        get(k, []).forEach(function (a) {
          var id = docId(juz, a);
          if (done[id]) return;
          var data = enc(juz, a); data.at = fs.serverTimestamp();
          jobs.push(fs.setDoc(fs.doc(S.fb.db, "users", S.user.uid, "attempts", id), data).then(function () { done[id] = 1; }));
        });
      });
      return Promise.all(jobs);
    }).then(function () {
      set(DONE, Object.keys(done)); if (maxAt) set(LAST, maxAt);
      emit("synced");
      if (pulled) window.dispatchEvent(new Event("msync-changed"));
    }).catch(function (e) {
      emit("error", e && e.code === "permission-denied" ? "رُفض الوصول: تحقق من قواعد Firestore." : "تعذّرت المزامنة الآن؛ ستُعاد تلقائيًا عند المحاولة التالية.");
    }).then(function () {
      S.busy = false; if (S.again) { S.again = false; return syncNow(); }
    });
  }

  /* ---- public API ---- */
  var API = {
    enabled: enabled,
    on: function (cb) { S.cbs.push(cb); cb({ user: S.user, status: S.status, error: S.err }); },
    state: function () { return { user: S.user, status: S.status }; },
    syncNow: syncNow,
    onSubmit: function () { if (S.user) syncNow(); },
    signIn: function () {
      set(FLAG, 1);
      return boot().then(function (fb) {
        var p = new fb.auth.GoogleAuthProvider();
        return fb.auth.signInWithPopup(fb.a, p).catch(function (e) {
          if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) return fb.auth.signInWithRedirect(fb.a, p);
          if (e && (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request")) { del(FLAG); return; }
          throw e;
        });
      }).catch(function (e) {
        if (e && e.code === "auth/unauthorized-domain") emit("error", "هذا الموقع غير مضاف إلى النطاقات المصرّح بها في Firebase.");
        else if (S.status !== "error") emit("error", "تعذّر تسجيل الدخول.");
      });
    },
    signOut: function () {
      del(FLAG);
      return (S.fb ? S.fb.auth.signOut(S.fb.a) : Promise.resolve()).then(function () { S.user = null; emit("idle"); });
    },
    /* يحذف محاولات المستخدم من الخادم ثم حسابه في Firebase. لا يمس النسخة المحلية في المتصفح. */
    deleteData: function () {
      if (!S.user || !S.fb) return Promise.resolve(false);
      var fs = S.fb.fs, u = S.user;
      emit("syncing");
      return fs.getDocs(fs.collection(S.fb.db, "users", u.uid, "attempts")).then(function (snap) {
        var jobs = []; snap.forEach(function (d) { jobs.push(fs.deleteDoc(d.ref)); });
        return Promise.all(jobs);
      }).then(function () {
        return S.fb.auth.deleteUser(u).catch(function (e) {
          if (e && e.code === "auth/requires-recent-login") {
            return S.fb.auth.reauthenticateWithPopup(u, new S.fb.auth.GoogleAuthProvider()).then(function () { return S.fb.auth.deleteUser(S.fb.a.currentUser); });
          }
          throw e;
        });
      }).then(function () {
        del(FLAG); del(DONE); del(LAST); S.user = null; emit("idle"); return true;
      }).catch(function () { emit("error", "تعذّر حذف البيانات؛ حاول مرة أخرى."); return false; });
    }
  };
  window.MSync = API;

  /* استعادة الجلسة تلقائيًا إن كان المستخدم قد فعّل المزامنة سابقًا */
  if (enabled() && get(FLAG, 0)) boot().catch(function () {});
})();
</script>
<script>/* محاكي اختبارات مُدَّكِر — يعمل بلا خادم. البيانات في window.QUIZ */
(function () {
  "use strict";
  var Q = window.QUIZ;
  var NS = "moddaker-mukhtasar";
  var KEY_ATT = NS + ":attempts:" + Q.id;
  var KEY_CUR = NS + ":current:" + Q.id;
  var PER_PAGE = 1;
  var LETTERS = ["a", "b", "c", "d", "e"];
  var app = document.getElementById("app");
  var timerHandle = null;

  /* ---------- storage (fails soft) ---------- */
  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function drop(k) { try { localStorage.removeItem(k); } catch (e) {} }

  /* ---------- helpers ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  var AR_DAYS = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
  var AR_MONTHS = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
  function fmtDate(ts) {
    var d = new Date(ts), h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    return AR_DAYS[d.getDay()] + "، " + d.getDate() + " " + AR_MONTHS[d.getMonth()] + " " + d.getFullYear() + "، " + h + ":" + (m < 10 ? "0" : "") + m + " " + ap;
  }
  function fmtDur(ms) {
    var s = Math.max(0, Math.round(ms / 1000)), m = Math.floor(s / 60), r = s % 60, out = [];
    if (m) out.push(m + " دقائق"); if (r || !m) out.push(r + " ثواني"); return out.join(" ");
  }
  function clock(ms) {
    var s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    return h + ":" + (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r;
  }
  function byId(id) { for (var i = 0; i < Q.questions.length; i++) if (Q.questions[i].id === id) return Q.questions[i]; }
  function band(p) {
    if (p >= 90) return { c: "#2f6b3a", h: "🌟 امتياز مرتفع (90% - 100%)", t: "أداء استثنائي! أنت مستعد للاختبار الشامل في هذا الجزء.", tip: "💡 راجع الأسئلة الخاطئة إن وجدت لضمان العلامة الكاملة." };
    if (p >= 80) return { c: "#3f6e8c", h: "⭐ امتياز (80% - 89%)", t: "أداء ممتاز، بقي القليل لتبلغ التمام.", tip: "💡 ركِّز على الكلمات الغريبة التي أخطأت فيها وأعد قراءة تفسيرها في المختصر." };
    if (p >= 70) return { c: "#4B365F", h: "✅ جيد جداً (70% - 79%)", t: "مستواك مطمئن، ولكن يمكنك تحسينه أكثر.", tip: "💡 هام: راجع الأخطاء أدناه، ثم أعد المحاولة بعد مراجعة صفحات الجزء." };
    if (p >= 60) return { c: "#8a6d1f", h: "👍 جيد (60% - 69%)", t: "تحتاج إلى مراجعة إضافية لهذا الجزء.", tip: "💡 اقرأ تفسير المختصر لصفحات الجزء مع التركيز على الكلمات المشروحة والفوائد." };
    return { c: "#8a2b2b", h: "⚠️ يحتاج إلى مراجعة (أقل من 60%)", t: "هذا الجزء يحتاج إلى مذاكرة مركّزة قبل الاختبار الشامل.", tip: "💡 ابدأ بمراجعة الأخطاء أدناه واحدًا واحدًا، ثم أعد الاختبار." };
  }

  /* ---------- attempts ---------- */
  function attempts() { return load(KEY_ATT, []); }
  function current() { return load(KEY_CUR, null); }

  function newAttempt() {
    var qs = shuffle(Q.questions).slice(0, Q.questions_per_attempt || Q.questions.length);
    var now = Date.now();
    var cur = {
      started: now, deadline: now + Q.time_limit_min * 60000, page: 0,
      slots: qs.map(function (q) { return { id: q.id, order: shuffle(q.options.map(function (_, i) { return i; })), resp: null, flag: false }; })
    };
    save(KEY_CUR, cur);
    return cur;
  }

  function grade(cur, finishedAt) {
    var marks = 0;
    cur.slots.forEach(function (s) { var q = byId(s.id); s.ok = s.resp !== null && q && s.resp === q.answer; if (s.ok) marks++; });
    var rec = { started: cur.started, finished: finishedAt, slots: cur.slots, marks: marks, total: cur.slots.length, timeout: !!cur.timeout };
    var all = attempts(); all.push(rec); save(KEY_ATT, all); drop(KEY_CUR);
    if (window.MSync) window.MSync.onSubmit();
    return all.length - 1;
  }

  /* ---------- views ---------- */
  function setTitle(sub) { document.title = Q.title + (sub ? ": " + sub : "") + " | مدكر"; }
  function stopTimer() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } var t = document.getElementById("tbtimer"); if (t) t.textContent = ""; }

  function viewStart() {
    stopTimer(); setTitle("");
    var all = attempts(), cur = current();
    var best = all.reduce(function (b, a) { return Math.max(b, a.marks / a.total * 100); }, -1);
    var rows = all.map(function (a, i) {
      var p = a.marks / a.total * 100;
      return "<tr><td class='center'>" + (i + 1) + "</td><td>منتهية<br><small>تم التسليم " + fmtDate(a.finished) + "</small></td><td class='center'>" + a.marks.toFixed(2) + "</td><td class='center'>" + (p).toFixed(2) + "</td><td class='center'><a href='#review/" + i + "'>مراجعة</a></td></tr>";
    }).join("");
    app.innerHTML =
      "<div class='crumbs'><a href='" + Q.home + "'>الصفحة الرئيسية</a> / " + esc(Q.title) + "</div>" +
      "<div class='card'><h1 class='qtitle'>" + esc(Q.title) + "</h1>" +
      "<div class='notice'>" + esc(Q.description) + "</div>" +
      "<div class='quizinfo'><p>عدد الأسئلة: " + (Q.questions_per_attempt || Q.questions.length) + " سؤالًا (ترتيب عشوائي للأسئلة والخيارات)</p><p>المحاولات المسموح بها: غير محدودة</p><p>الحد الزمني: " + Q.time_limit_min + " دقيقة</p><p>طريقة التقييم: أعلى درجة</p></div>" +
      (all.length ? "<h3>ملخص محاولاتك السابقة</h3><table class='gen'><thead><tr><th class='center'>المحاولة</th><th>الحالة</th><th class='center'>العلامات / " + all[0].total.toFixed(2) + "</th><th class='center'>الدرجة / 100.00</th><th class='center'>مراجعة</th></tr></thead><tbody>" + rows + "</tbody></table>" +
        "<p class='center'><b>أعلى درجة: " + best.toFixed(2) + " / 100.00</b></p>" : "") +
      "<div class='center' style='margin-top:18px'>" +
      (cur ? "<button class='btn btn-primary' id='go'>متابعة المحاولة الأخيرة</button>" : "<button class='btn btn-primary' id='go'>" + (all.length ? "إعادة محاولة الاختبار" : "ابدأ المحاولة") + "</button>") +
      "</div></div>";
    document.getElementById("go").onclick = function () {
      if (cur) { location.hash = "attempt"; return; }
      modal("اختبار محدد بزمن", "<p>هذا الاختبار له حد زمني قدره <b>" + Q.time_limit_min + " دقيقة</b>. سيبدأ العد التنازلي فور بدء المحاولة ولا يمكن إيقافه، ويجب التسليم قبل انتهاء الوقت.</p><p>هل أنت متأكد من رغبتك في البدء الآن؟</p>",
        "ابدأ المحاولة", function () { newAttempt(); location.hash = "attempt"; });
    };
  }

  function navBlock(cur, mode, curPage) {
    var html = "<div class='navblock'><h3>التنقل في الاختبار</h3>";
    if (mode === "attempt") html += "<div class='timer' id='timer'>الوقت المتبقي <b id='tleft'>" + clock(cur.deadline - Date.now()) + "</b></div>";
    html += "<div class='qnbuttons'>" + cur.slots.map(function (s, i) {
      var cls = "qnb";
      if (mode === "attempt") { if (s.resp !== null) cls += " answered"; if (i === curPage) cls += " current"; }
      else cls += s.ok ? " correct" : " incorrect";
      if (s.flag) cls += " flagged";
      return "<button class='" + cls + "' data-i='" + i + "' title='سؤال " + (i + 1) + "'><span class='n'>" + (i + 1) + "</span><span class='st'></span></button>";
    }).join("") + "</div>";
    if (mode === "attempt") html += "<button class='btn btn-link' id='finish'>إنهاء المحاولة...</button>";
    else html += "<a class='btn btn-link' href='#review-all'>عرض كل الأسئلة في صفحة واحدة</a><br><a class='btn btn-link' href='#'>إنهاء المراجعة</a>";
    return html + "</div>";
  }

  function qInfo(i, stateTxt, gradeTxt, s, editable) {
    return "<div class='info'><h3 class='no'>سؤال <span class='qno'>" + (i + 1) + "</span></h3><div class='state'>" + stateTxt + "</div><div class='grade'>" + gradeTxt + "</div>" +
      (editable ? "<div class='flag' data-flag='" + i + "'>" + (s.flag ? "🚩 أزل العلامة" : "⚐ علِّم هذا السؤال") + "</div>" : (s.flag ? "<div class='flag'>🚩 مُعلَّم</div>" : "")) + "</div>";
  }

  function qText(q) {
    return "<div class='qtext'><div class='stem'>" + (q.ayah ? "قال تعالى: <span class='ayah'>﴿" + esc(q.ayah) + "﴾</span> [" + esc(q.ref) + "]؛ " : (q.ref ? "[" + esc(q.ref) + "] " : "")) + esc(q.stem) + "</div></div>";
  }

  function viewAttempt() {
    var cur = current();
    if (!cur) { location.hash = ""; return; }
    if (Date.now() >= cur.deadline) { cur.timeout = true; save(KEY_CUR, cur); var idx = grade(cur, cur.deadline); location.hash = "review/" + idx; return; }
    setTitle("محاولة");
    var p = Math.min(cur.page || 0, cur.slots.length - 1);
    var s = cur.slots[p], q = byId(s.id);
    var opts = s.order.map(function (oi, k) {
      return "<label><input type='radio' name='ans' value='" + oi + "'" + (s.resp === oi ? " checked" : "") + "><span class='an'>" + LETTERS[k] + ".</span><span>" + esc(q.options[oi]) + "</span></label>";
    }).join("");
    app.innerHTML = "<div class='attempt'><div>" +
      "<div class='que'>" + qInfo(p, s.resp === null ? "لم تتم الإجابة بعد" : "تم حفظ الإجابة", "الدرجة من 1.00", s, true) +
      "<div class='content'><div class='formulation'>" + qText(q) + "<p class='prompt'>إختر أحد الخيارات:</p><div class='answer'>" + opts + "</div>" +
      (s.resp !== null ? "<button class='btn btn-link' id='clr'>إزالة اختياري</button>" : "") + "</div></div></div>" +
      "<div class='pager'>" + (p > 0 ? "<button class='btn btn-secondary' id='prev'>الصفحة السابقة</button>" : "<span></span>") +
      "<button class='btn btn-primary' id='next'>" + (p < cur.slots.length - 1 ? "الصفحة التالية" : "إنهاء المحاولة...") + "</button></div>" +
      "</div>" + navBlock(cur, "attempt", p) + "</div>";
    function persist() { save(KEY_CUR, cur); }
    app.querySelectorAll("input[name=ans]").forEach(function (r) { r.onchange = function () { s.resp = +r.value; persist(); viewAttempt(); }; });
    var clr = document.getElementById("clr"); if (clr) clr.onclick = function () { s.resp = null; persist(); viewAttempt(); };
    app.querySelector("[data-flag]").onclick = function () { s.flag = !s.flag; persist(); viewAttempt(); };
    var prev = document.getElementById("prev"); if (prev) prev.onclick = function () { cur.page = p - 1; persist(); viewAttempt(); scrollTo(0, 0); };
    document.getElementById("next").onclick = function () { if (p < cur.slots.length - 1) { cur.page = p + 1; persist(); viewAttempt(); scrollTo(0, 0); } else location.hash = "summary"; };
    document.getElementById("finish").onclick = function () { location.hash = "summary"; };
    app.querySelectorAll(".qnb").forEach(function (b) { b.onclick = function () { cur.page = +b.dataset.i; persist(); viewAttempt(); scrollTo(0, 0); }; });
    startTimer(cur);
  }

  function startTimer(cur) {
    stopTimer();
    function tick() {
      var left = cur.deadline - Date.now(), el = document.getElementById("tleft");
      if (el) { el.textContent = clock(left); document.getElementById("timer").classList.toggle("low", left < 5 * 60000); }
      var tb = document.getElementById("tbtimer"); if (tb) { tb.textContent = "⏱ " + clock(left); tb.classList.toggle("low", left < 5 * 60000); }
      if (left <= 0) {
        stopTimer(); var c = current(); if (!c) return; c.timeout = true; save(KEY_CUR, c);
        var idx = grade(c, c.deadline);
        modal("انتهى الوقت", "<p>انتهى الوقت المحدد للاختبار، وتم إرسال محاولتك تلقائيًا.</p>", "مراجعة المحاولة", function () { location.hash = "review/" + idx; }, true);
      }
    }
    tick(); timerHandle = setInterval(tick, 1000);
  }

  function viewSummary() {
    var cur = current(); if (!cur) { location.hash = ""; return; }
    setTitle("ملخص المحاولة");
    var unanswered = cur.slots.filter(function (s) { return s.resp === null; }).length;
    app.innerHTML = "<div class='attempt'><div class='card'><h1 class='qtitle'>ملخص المحاولة</h1>" +
      "<table class='gen'><thead><tr><th class='center'>سؤال</th><th>الحالة</th></tr></thead><tbody>" +
      cur.slots.map(function (s, i) { return "<tr><td class='center'>" + (s.flag ? "🚩 " : "") + "<a href='#' data-go='" + i + "'>" + (i + 1) + "</a></td><td class='" + (s.resp === null ? "state-none" : "") + "'>" + (s.resp === null ? "لم تتم الإجابة بعد" : "تم حفظ الإجابة") + "</td></tr>"; }).join("") +
      "</tbody></table><div class='center'><button class='btn btn-secondary' id='back'>العودة إلى المحاولة</button>" +
      "<p style='margin:14px 0 6px'>يجب أن يتم إرسال هذه المحاولة قبل انتهاء الوقت.</p>" +
      "<button class='btn btn-primary' id='submit'>إرسال الكل وإنهاء</button></div></div>" + navBlock(cur, "attempt", -1) + "</div>";
    app.querySelectorAll("[data-go]").forEach(function (a) { a.onclick = function (e) { e.preventDefault(); cur.page = +a.dataset.go; save(KEY_CUR, cur); location.hash = "attempt"; }; });
    app.querySelectorAll(".qnb").forEach(function (b) { b.onclick = function () { cur.page = +b.dataset.i; save(KEY_CUR, cur); location.hash = "attempt"; }; });
    document.getElementById("back").onclick = document.getElementById("finish").onclick = function () { location.hash = "attempt"; };
    document.getElementById("submit").onclick = function () {
      modal("تأكيد", "<p>بمجرد الإرسال، لن تتمكن من تغيير إجاباتك لهذه المحاولة." + (unanswered ? "<br><b style='color:#c62828'>تنبيه: لديك " + unanswered + " سؤال/أسئلة بلا إجابة.</b>" : "") + "</p>",
        "إرسال الكل وإنهاء", function () { var c = current(); if (!c) return; var idx = grade(c, Date.now()); location.hash = "review/" + idx; });
    };
    startTimer(cur);
  }

  function renderReviewQ(a, s, i) {
    var q = byId(s.id); if (!q) return "";
    var opts = s.order.map(function (oi, k) {
      var cls = "", ic = "";
      if (oi === q.answer) { cls = "is-correct"; ic = "<span class='ok-ic'>✓</span>"; }
      else if (oi === s.resp) { cls = "is-wrong"; ic = "<span class='bad-ic'>✗</span>"; }
      return "<label class='" + cls + "'><input type='radio' disabled" + (s.resp === oi ? " checked" : "") + "><span class='an'>" + LETTERS[k] + ".</span><span>" + esc(q.options[oi]) + "</span>" + ic + "</label>";
    }).join("");
    var stateTxt = s.resp === null ? "<span class='state-wrong'>لم تتم الإجابة</span>" : (s.ok ? "<span class='state-correct'>صحيح</span>" : "<span class='state-wrong'>خطأ</span>");
    var fb = "<div class='sfb" + (s.ok ? "" : " bad") + "'><b>" + (s.ok ? "إجابة صحيحة." : (s.resp === null ? "لم تُجب عن هذا السؤال." : "إجابة خاطئة.")) + "</b><br>" +
      (q.type === "faida" ? "الفائدة كما في المختصر: " : "التفسير: ") + esc(q.explanation).replace(/_([^_]+)_/g, "<b>$1</b>").replace(/_/g, "") + "<span class='src'>[المختصر في تفسير القرآن الكريم" + (q.page ? " — ص " + q.page : "") + "]</span></div>";
    return "<div class='que' id='q" + i + "'>" + qInfo(i, stateTxt, "درجة " + (s.ok ? "1.00" : "0.00") + " من 1.00", s, false) +
      "<div class='content'><div class='formulation'>" + qText(q) + "<span class='tag'>" + (q.type === "faida" ? "فوائد الآيات" : "معاني الكلمات") + "</span><div class='answer' style='margin-top:8px'>" + opts + "</div>" + fb + "</div></div></div>";
  }

  function viewReview(idx, onlyWrong) {
    stopTimer();
    var all = attempts(), a = all[idx]; if (!a) { location.hash = ""; return; }
    setTitle("مراجعة المحاولة");
    var p = a.marks / a.total * 100, b = band(p);
    var list = a.slots.map(function (s, i) { return (!onlyWrong || !s.ok) ? renderReviewQ(a, s, i) : ""; }).join("");
    app.innerHTML = "<div class='attempt'><div><div class='card' style='margin-bottom:20px'>" +
      "<table class='reviewsum'>" +
      "<tr><th>الحالة</th><td>منتهية" + (a.timeout ? " (أُرسلت تلقائيًا عند انتهاء الوقت)" : "") + "</td></tr>" +
      "<tr><th>بدأ</th><td>" + fmtDate(a.started) + "</td></tr>" +
      "<tr><th>إكتمل</th><td>" + fmtDate(a.finished) + "</td></tr>" +
      "<tr><th>الفترة</th><td>" + fmtDur(a.finished - a.started) + "</td></tr>" +
      "<tr><th>العلامات</th><td>" + a.marks.toFixed(2) + "/" + a.total.toFixed(2) + "</td></tr>" +
      "<tr><th>الدرجة</th><td><b>" + p.toFixed(2) + "</b> من 100.00 (<b>" + Math.round(p) + "</b>%)</td></tr>" +
      "<tr><th>الإفادة</th><td><div class='band'><div class='bh' style='background:" + b.c + "'>" + b.h + "</div><div class='bb'>" + b.t + "<div class='tip'>" + b.tip + "</div></div></div></td></tr>" +
      "</table><div class='center'>" +
      (onlyWrong ? "<a class='btn btn-secondary' href='#review/" + idx + "'>عرض كل الأسئلة</a>" : "<a class='btn btn-secondary' href='#review/" + idx + "/wrong'>عرض الأخطاء فقط (" + (a.total - a.marks) + ")</a>") +
      " <a class='btn btn-primary' href='#'>إنهاء المراجعة</a></div></div>" + (list || "<div class='card center'>لا توجد أخطاء في هذه المحاولة. بارك الله فيك!</div>") +
      "</div>" + navBlock(a, "review") + "</div>";
    app.querySelectorAll(".qnb").forEach(function (bt) { bt.onclick = function () { var el = document.getElementById("q" + bt.dataset.i); if (el) el.scrollIntoView({ behavior: "smooth" }); }; });
    var ra = app.querySelector("a[href='#review-all']"); if (ra) ra.setAttribute("href", "#review/" + idx);
  }

  function modal(title, body, okTxt, onOk, noCancel) {
    var bg = document.createElement("div"); bg.className = "modal-bg";
    bg.innerHTML = "<div class='modal' role='dialog'><div class='mh'>" + title + "</div><div class='mb'>" + body + "</div><div class='mf'><button class='btn btn-primary' data-ok>" + okTxt + "</button>" + (noCancel ? "" : "<button class='btn btn-secondary' data-cancel>إلغاء</button>") + "</div></div>";
    document.body.appendChild(bg);
    bg.querySelector("[data-ok]").onclick = function () { bg.remove(); onOk(); };
    var c = bg.querySelector("[data-cancel]"); if (c) c.onclick = function () { bg.remove(); };
  }

  function route() {
    document.querySelectorAll(".modal-bg").forEach(function (m) { m.remove(); });
    var h = location.hash.replace(/^#/, "");
    if (h === "attempt") return viewAttempt();
    if (h === "summary") return viewSummary();
    var m = h.match(/^review\/(\d+)(\/wrong)?$/); if (m) { scrollTo(0, 0); return viewReview(+m[1], !!m[2]); }
    viewStart();
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body></html>
